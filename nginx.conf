
# 主配置区域
worker_processes  1;
pid        C:/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx/conf/mime.types;
    default_type  application/octet-stream;
    
    # 临时目录配置
    client_body_temp_path C:/nginx/temp/client_body_temp;
    proxy_temp_path C:/nginx/temp/proxy_temp;
    fastcgi_temp_path C:/nginx/temp/fastcgi_temp;
    uwsgi_temp_path C:/nginx/temp/uwsgi_temp;
    scgi_temp_path C:/nginx/temp/scgi_temp;
    
    # 日志配置
    access_log  C:/nginx/logs/access.log;
    error_log   C:/nginx/logs/error.log;
    
    # 此处添加您的server配置
    server {
        listen 80;
        server_name bxks.online www.bxks.online 127.0.0.1 localhost;
        
        # 反向代理配置
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header Cookie $http_cookie;
            proxy_pass http://127.0.0.1:8000;  # 这里的端口要与Django服务器监听的端口一致
        }
        
        # 静态文件服务
        location /static/ {
            alias C:/Users/Administrator/lnjx2026/staticfiles/;
            expires 30d;
            add_header Cache-Control public;
        }
        
        # 媒体文件配置
        location /media/ {
            alias C:/Users/Administrator/lnjx2026/media/;
            expires 30d;
        }
    }
}