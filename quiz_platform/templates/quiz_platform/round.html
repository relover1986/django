<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题中 · 一建矿业</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f0f4f8; color: #1a1a2e; }
        .nav { background: #1a1a2e; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
        .nav a { color: #a0aec0; text-decoration: none; font-size: 15px; padding: 4px 0; }
        .nav a:hover, .nav a.active { color: #fff; border-bottom: 2px solid #48bb78; }
        .nav .brand { color: #fff; font-size: 18px; font-weight: 600; margin-right: 16px; }
        .container { max-width: 800px; margin: 0 auto; padding: 32px 16px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 12px 0; }
        .progress-bar .fill { height: 100%; background: #48bb78; border-radius: 4px; transition: width 0.3s; }
        .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .tag-single { background: #bee3f8; color: #2b6cb0; }
        .tag-multi { background: #fefcbf; color: #975a16; }
        .option-item { padding: 10px 14px; margin: 6px 0; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
        .option-item:hover { border-color: #4299e1; background: #ebf8ff; }
        .option-item.selected { border-color: #48bb78; background: #f0fff4; }
        .btn { display: inline-block; background: #48bb78; color: #fff; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #38a169; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #4299e1; }
        .btn-secondary:hover { background: #3182ce; }
        .result-box { padding: 16px; border-radius: 8px; margin: 12px 0; }
        .result-box.correct { background: #f0fff4; border: 1px solid #c6f6d5; }
        .result-box.wrong { background: #fff5f5; border: 1px solid #fed7d7; }
        .analysis-box { background: #fffbeb; border: 1px solid #fefcbf; padding: 14px; border-radius: 6px; margin-top: 8px; font-size: 14px; line-height: 1.6; color: #744210; }
        .question-num { font-size: 13px; color: #718096; margin-bottom: 4px; }
        .question-text { font-size: 16px; line-height: 1.7; margin-bottom: 16px; }
        .hidden { display: none; }
        .result-summary { text-align: center; padding: 20px; }
        .result-summary .score { font-size: 48px; font-weight: 700; }
        .result-summary .score.pass { color: #38a169; }
        .result-summary .score.fail { color: #e53e3e; }
        @media (max-width: 600px) { .container { padding: 16px 8px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <span class="brand">📚 一建矿业</span>
        <a href="{% url 'quiz_platform:index' %}">首页</a>
        <a href="{% url 'quiz_platform:start-round' %}" class="active">刷题</a>
        <a href="{% url 'quiz_platform:wrong-book' %}">错题本</a>
        <a href="{% url 'quiz_platform:stats' %}">统计</a>
        <a href="{% url 'quiz_platform:qa-page' %}">AI 问答</a>
    </nav>
    <div class="container">
        <div id="round-progress" class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span id="progress-text">第 1 / {{ total }} 题</span>
                <span id="correct-count" style="color: #38a169;">✅ 0</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="fill" style="width: 0%;"></div></div>
        </div>

        <div id="question-area" class="card">
            <!-- 由 JS 动态渲染 -->
        </div>

        <div id="result-area" class="hidden"></div>

        <div id="nav-buttons" class="hidden" style="text-align: center; margin-top: 16px;">
            <button onclick="location.href='/home/quiz/round/'" class="btn">🔄 再来一轮</button>
            <button onclick="location.href='/home/quiz/'" class="btn btn-secondary" style="margin-left: 8px;">🏠 返回首页</button>
        </div>
    </div>

    <script>
        const questions = {{ questions_json|safe }};
        const total = questions.length;
        let currentIdx = 0;
        let answers = {};
        let results = [];

        function renderQuestion() {
            if (currentIdx >= total) {
                submitAll();
                return;
            }
            const q = questions[currentIdx];
            const area = document.getElementById('question-area');
            const options = q.options.split(/(?=[A-E]\.)/).filter(s => s.trim());

            let optionsHtml = options.map(opt => {
                const letter = opt.trim()[0];
                const userAns = answers[q.id] || '';
                const isSelected = q.type === '多选题' ? userAns.includes(letter) : userAns === letter;
                return `<div class="option-item ${isSelected ? 'selected' : ''}" onclick="selectOption(${q.id}, '${letter}')">${opt}${q.type === '多选题' && isSelected ? ' ✅' : ''}</div>`;
            }).join('');

            area.innerHTML = `
                <div class="question-num">第 ${currentIdx + 1} / ${total} 题</div>
                <div><span class="tag ${q.type === '单选题' ? 'tag-single' : 'tag-multi'}">${q.type}</span></div>
                <div class="question-text">${q.question}</div>
                ${optionsHtml}
                <div style="margin-top: 16px; text-align: right;">
                    <button class="btn" onclick="nextQuestion()" id="next-btn" ${answers[q.id] ? '' : 'disabled'}>
                        ${currentIdx === total - 1 ? '📝 提交答卷' : '下一题 →'}
                    </button>
                </div>
            `;
            document.getElementById('progress-text').textContent = `第 ${currentIdx + 1} / ${total} 题`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / total) * 100}%`;
        }

        function selectOption(qId, letter) {
            const q = questions.find(q => q.id === qId);
            if (!q) return;
            if (q.type === '多选题') {
                // 多选题：切换选项
                if (!answers[qId]) answers[qId] = '';
                if (answers[qId].includes(letter)) {
                    answers[qId] = answers[qId].replace(letter, '');
                } else {
                    answers[qId] = (answers[qId] + letter).split('').sort().join('');
                }
            } else {
                // 单选题：单选
                answers[qId] = letter;
            }
            renderQuestion();
        }

        function nextQuestion() {
            if (!answers[questions[currentIdx].id]) return;
            currentIdx++;
            if (currentIdx < total) {
                renderQuestion();
            } else {
                submitAll();
            }
        }

        async function submitAll() {
            document.getElementById('question-area').innerHTML = '<div style="text-align:center;padding:40px"><p>提交中…</p></div>';
            document.getElementById('next-btn') && (document.getElementById('next-btn').disabled = true);
            document.getElementById('nav-buttons').classList.remove('hidden');

            try {
                const resp = await fetch('/home/quiz/submit/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
                    body: JSON.stringify({answers: answers})
                });
                const data = await resp.json();
                results = data.results;
                displayResults(data);
            } catch(e) {
                document.getElementById('question-area').innerHTML = `<div style="color:red">提交失败: ${e.message}</div>`;
            }
        }

        function displayResults(data) {
            const area = document.getElementById('question-area');
            const pass = data.score >= 60;
            let html = `
                <div class="result-summary">
                    <div class="score ${pass ? 'pass' : 'fail'}">${data.score}分</div>
                    <div style="font-size: 18px; color: #718096; margin-top: 8px;">
                        ✅ ${data.correct_count} / ${data.total} 正确
                    </div>
                </div>
                <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">
            `;

            data.results.forEach((r, i) => {
                const q = questions.find(q => q.id === r.id);
                if (!q) return;
                const options = q.options.split(/(?=[A-E]\.)/).filter(s => s.trim());
                let optionsHtml = options.map(opt => {
                    const letter = opt.trim()[0];
                    let cls = 'option-item';
                    if (r.correct_answer.includes(letter)) cls += ' correct';
                    if (r.user_answer === letter && !r.is_correct) cls += ' wrong';
                    return `<div class="${cls}">${opt} ${r.correct_answer.includes(letter) ? '✅' : ''} ${r.user_answer === letter && letter && !r.is_correct ? '❌' : ''}</div>`;
                }).join('');

                html += `
                    <div class="card" style="margin-bottom: 12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span>第 ${i+1} 题 · <span class="tag ${q.type === '单选题' ? 'tag-single' : 'tag-multi'}">${q.type}</span></span>
                            <span class="tag ${r.is_correct ? 'tag-mastered' : 'tag-wrong'}">${r.is_correct ? '✅ 正确' : '❌ 错误'}</span>
                        </div>
                        <div class="question-text">${q.question}</div>
                        ${optionsHtml}
                        <div style="margin-top: 8px; font-size: 14px;">
                            你的答案: <strong>${r.user_answer}</strong> ·
                            正确答案: <strong style="color: #38a169;">${r.correct_answer}</strong> ·
                            正确连击: ${r.streak_after}
                        </div>
                        ${r.analysis ? `<div class="analysis-box">📖 ${r.analysis}</div>` : ''}
                    </div>
                `;
            });

            area.innerHTML = html;
            document.getElementById('round-progress').innerHTML = `<div style="text-align:center;padding:8px">✅ 本轮完成！</div>`;
        }

        // 初始化
        renderQuestion();
    </script>
</body>
</html>
