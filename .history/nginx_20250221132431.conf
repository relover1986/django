
# 主配置区域
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # 此处添加您的server配置
    server {
        listen 80;
        server_name lnjx.xyz www.lnjx.xyz;
        # ...其他配置内容...
    
    # 将所有HTTP请求重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

    server {
        listen       443 ssl;
        server_name lnjx.xyz www.lnjx.xyz;

        ssl_certificate     C:/nginx/lnjx.xyz.pem;
        ssl_certificate_key C:/nginx/lnjx.xyz.key;
















        # 反向代理配置
    location / {
        proxy_pass http://127.0.0.1:8001;  # 这里的端口要与WSGI服务器监听的端口一致
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-CSRFToken $http_x_csrf_token;
    proxy_set_header Cookie $http_cookie;
    proxy_pass http://backend_server;
}























    # 静态文件服务
    location /static/ {
        alias C:/Users/Administrator/OneDrive/lnjx/staticfiles/;
        expires 30d;
        add_header Cache-Control public;
    }
    
    # 媒体文件配置（可选）
    location /media/ {
        alias C:/Users/Administrator/OneDrive/lnjx/media/;
        expires 30d;
    }
}
}