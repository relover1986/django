{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爆破作业登记记录</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>爆破作业登记记录</h4>
            <a href="/home/blasting_register/" class="btn btn-primary">新增登记</a>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-hover bg-white">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>班次</th>
                        <th>爆破员</th>
                        <th>作业点数</th>
                        <th>使用日期</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for r in records %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ r.shift }}</td>
                        <td>{{ r.blaster }}</td>
                        <td>{{ r.work_count }}</td>
                        <td>{{ r.usage_date|date:"Y-m-d" }}</td>
                        <td>{{ r.created_at|date:"Y-m-d H:i" }}</td>
                        <td><a href="/home/blasting_register_detail/{{ r.id }}/" class="btn btn-sm btn-outline-info">查看</a></td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="6" class="text-center text-muted">暂无记录</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <a href="/home/blasting_register/" class="btn btn-outline-secondary">返回登记</a>
        <a href="/home/" class="btn btn-danger">返回主页</a>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
