{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>添加爆破员</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h4 class="mb-3">添加爆破员</h4>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">爆破员姓名</label>
                <input type="text" name="name" class="form-control" required placeholder="请输入爆破员姓名">
            </div>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/home/blaster_list/" class="btn btn-outline-secondary">返回</a>
        </form>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
