{% extends "home.html" %}
{% block content %}
<br /><br /><br /><br />
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">爆破现场记录 - 上传照片</h3>
    </div>
    <div class="card-body">
      <div class="mb-3">
        <label for="blaster" class="form-label">爆破员</label>
        <input type="text" id="blaster" name="blaster" class="form-control" placeholder="输入爆破员姓名">
      </div>
      <div class="mb-3">
        <label for="safety_officer" class="form-label">安全员</label>
        <input type="text" id="safety_officer" name="safety_officer" class="form-control" placeholder="输入安全员姓名">
      </div>
      <div class="mb-3">
        <label for="engineer" class="form-label">工程师</label>
        <input type="text" id="engineer" name="engineer" class="form-control" placeholder="输入工程师姓名">
      </div>
      <div class="mb-3">
        <label for="file_upload" class="form-label">选择照片</label>
        <input type="file" id="file_upload" name="file" accept="image/*" multiple class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">上传</button>
    </div>
  </div>
</form>
{% endblock %}
