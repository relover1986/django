{% extends 'home.html' %}
{% load static %}

{% block content %}
<style>
.grades-header { text-align: center; padding: 24px 16px 16px; }
.grades-header h4 { font-weight: 600; color: #1a1a2e; }
.grades-tabs { text-align: center; padding: 0 16px 16px; }
.grades-tabs .tab-btn {
  display: inline-block; padding: 8px 20px; margin: 0 4px;
  border-radius: 8px; font-size: 14px; cursor: pointer;
  border: 1px solid #e5e7eb; background: #fff; color: #374151;
  text-decoration: none; transition: all .15s;
}
.grades-tabs .tab-btn:hover { background: #f3f4f6; }
.grades-tabs .tab-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
.grades-chart { padding: 16px; }
</style>

<div class="container" style="max-width: 960px;">
  <div class="card" style="border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">
    <div class="grades-header">
      <h4>答题统计</h4>
    </div>

    <div class="grades-tabs">
      <a href="/home/grades_new" class="tab-btn {% if active_type == '' or not active_type %}active{% endif %}">全部</a>
      <a href="/home/grades_new?type=爆破" class="tab-btn {% if active_type == '爆破' %}active{% endif %}">爆破</a>
      <a href="/home/grades_new?type=非煤矿山井工" class="tab-btn {% if active_type == '非煤矿山井工' %}active{% endif %}">井工</a>
      <a href="/home/grades_new?type=危险品装卸" class="tab-btn {% if active_type == '危险品装卸' %}active{% endif %}">危装</a>
    </div>

    <div class="grades-chart">
      {{ chart_html|safe }}
    </div>
  </div>
</div>
{% endblock %}
