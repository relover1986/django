{% extends "home.html" %}

{% block content %}
<br>
<br>
<br>
<br>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">{{ title|default:标题 }}</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3 row">
                    <label for="{{ field.id_for_label }}" class="col-sm-3 col-form-label">{{ field.label }}</label>
                    <div class="col-sm-9">
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors|join:", " }}</div>
                        {% endif %}
                    </div>
                </div>
                {% endfor %}
                <div class="text-end">
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
