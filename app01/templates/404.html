<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面不存在</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: "Microsoft YaHei", sans-serif;
    }
    .card {
      text-align: center;
      padding: 60px 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .code {
      font-size: 72px;
      font-weight: 700;
      color: #3ecf8e;
      margin: 0;
    }
    .msg {
      font-size: 18px;
      color: #666;
      margin: 16px 0 32px;
    }
    .btn {
      display: inline-block;
      padding: 10px 32px;
      background: #3ecf8e;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 15px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: 0.85; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a2e; }
      .card { background: #2a2a3e; }
      .msg { color: #aaa; }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <p class="msg">页面不存在，可能地址有误</p>
    <a href="/home/" class="btn">← 回到主页</a>
  </div>
</body>
</html>
