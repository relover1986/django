{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爆破作业登记详情</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 800px;">
        <h4 class="mb-4">爆破作业登记详情</h4>

        <table class="table table-bordered bg-white">
            <tr><th style="width:120px">班次</th><td>{{ record.shift }}</td></tr>
            <tr><th>爆破员</th><td>{{ record.blaster }}</td></tr>
            <tr><th>提交时间</th><td>{{ record.created_at|date:"Y-m-d H:i:s" }}</td></tr>
        </table>

        <h6 class="mt-4">作业点明细</h6>
        <table class="table table-bordered table-hover bg-white">
            <thead class="table-light">
                <tr>
                    <th>作业点负责人</th>
                    <th>雷管数</th>
                    <th>乳化炸药数</th>
                    <th>粉状炸药数</th>
                </tr>
            </thead>
            <tbody>
                {% for w in work_list %}
                <tr>
                    <td>{{ w.work_name }}</td>
                    <td>{{ w.lei_guan }}</td>
                    <td>{{ w.ru_hua }}</td>
                    <td>{{ w.fen_zhuang }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-muted text-center">无作业点数据</td></tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="/home/blasting_register_list/" class="btn btn-outline-secondary">返回列表</a>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
