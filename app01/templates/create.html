

{% extends "home.html" %}

{% block content %}
<br>
<br>
<br>
<br>
<div class="container">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">{{ title|default:标题 }}</h3>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">保存</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
