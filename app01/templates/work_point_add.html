{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作业点登记</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 500px;">
        <h4 class="mb-4">作业点登记</h4>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">作业点负责人</label>
                <input type="text" name="manager" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">作业点</label>
                <input type="text" name="work_point" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/home/work_point_list/" class="btn btn-outline-secondary ms-2">返回列表</a>
        </form>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
