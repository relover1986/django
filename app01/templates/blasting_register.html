{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>爆破作业登记</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 800px;">
        <h4 class="mb-4">爆破作业登记</h4>

        {% if success %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form action="/home/blasting_register/" method="post" id="myForm">
            {% csrf_token %}

            <!-- 第一行：班次 + 爆破员 -->
            <div class="row mt-4 g-3">
                <div class="col-6">
                    <input type="hidden" name="shift" id="shiftVal">
                    <div class="dropdown w-100">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown">
                            选择班次
                        </button>
                        <ul class="dropdown-menu w-100">
                            <li><a class="dropdown-item shift-item" data-val="白班">白班</a></li>
                            <li><a class="dropdown-item shift-item" data-val="夜班">夜班</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-6">
                    <input type="hidden" name="blaster" id="blasterVal">
                    <div class="dropdown w-100">
                        <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown">
                            选择爆破员
                        </button>
                        <ul class="dropdown-menu w-100">
                            <li><a class="dropdown-item blaster-item" data-val="张三">张三</a></li>
                            <li><a class="dropdown-item blaster-item" data-val="李四">李四</a></li>
                            <li><a class="dropdown-item blaster-item" data-val="王五">王五</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 第二行：作业点 + 耗材 -->
            <div class="mt-4">
                <h6>作业点及耗材登记</h6>
                <div class="border p-3 rounded bg-white">
                    <div class="row align-items-center mb-3">
                        <div class="col-3">
                            <label><input type="checkbox" class="work-check" value="一号作业点"> 一号作业点</label>
                        </div>
                        <div class="col-3"><input type="number" class="form-control lei-guan" placeholder="雷管数"></div>
                        <div class="col-3"><input type="number" class="form-control ru-hua" placeholder="乳化炸药数"></div>
                        <div class="col-3"><input type="number" class="form-control fen-zhuang" placeholder="粉状炸药数"></div>
                    </div>
                    <div class="row align-items-center mb-3">
                        <div class="col-3">
                            <label><input type="checkbox" class="work-check" value="二号作业点"> 二号作业点</label>
                        </div>
                        <div class="col-3"><input type="number" class="form-control lei-guan" placeholder="雷管数"></div>
                        <div class="col-3"><input type="number" class="form-control ru-hua" placeholder="乳化炸药数"></div>
                        <div class="col-3"><input type="number" class="form-control fen-zhuang" placeholder="粉状炸药数"></div>
                    </div>
                    <div class="row align-items-center">
                        <div class="col-3">
                            <label><input type="checkbox" class="work-check" value="三号作业点"> 三号作业点</label>
                        </div>
                        <div class="col-3"><input type="number" class="form-control lei-guan" placeholder="雷管数"></div>
                        <div class="col-3"><input type="number" class="form-control ru-hua" placeholder="乳化炸药数"></div>
                        <div class="col-3"><input type="number" class="form-control fen-zhuang" placeholder="粉状炸药数"></div>
                    </div>
                </div>
            </div>

            <input type="hidden" name="work_list" id="workList">

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">提交登记</button>
                <a href="/home/" class="btn btn-outline-secondary ms-2">返回主页</a>
            </div>
        </form>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script>
    document.querySelectorAll('.shift-item').forEach(item => {
        item.addEventListener('click', function(e){
            e.preventDefault();
            document.getElementById('shiftVal').value = this.dataset.val;
            this.closest('.dropdown').querySelector('button').innerText = this.innerText;
        });
    });
    document.querySelectorAll('.blaster-item').forEach(item => {
        item.addEventListener('click', function(e){
            e.preventDefault();
            document.getElementById('blasterVal').value = this.dataset.val;
            this.closest('.dropdown').querySelector('button').innerText = this.innerText;
        });
    });
    document.getElementById('myForm').addEventListener('submit', function(e){
        let arr = [];
        document.querySelectorAll('.work-check').forEach((chk, idx) => {
            if(chk.checked){
                arr.push({
                    work_name: chk.value,
                    lei_guan: document.querySelectorAll('.lei-guan')[idx].value || 0,
                    ru_hua: document.querySelectorAll('.ru-hua')[idx].value || 0,
                    fen_zhuang: document.querySelectorAll('.fen-zhuang')[idx].value || 0
                });
            }
        });
        document.getElementById('workList').value = JSON.stringify(arr);
    });
    </script>
</body>
</html>
