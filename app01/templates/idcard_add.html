{% extends "home.html" %}

{% block content %}
<style>
.idcard-upload-page {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
}
.idcard-upload-page h2 {
    text-align: center;
    margin-bottom: 20px;
}
.idcard-side {
    flex: 1;
    min-width: 300px;
}
.idcard-side h3 {
    margin: 0 0 10px 0;
    font-size: 18px;
    border-left: 4px solid #007bff;
    padding-left: 10px;
}

/* 媒体容器 */
.media-container {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
}
.media-container video,
.media-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.media-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #888;
    font-size: 14px;
}

/* 身份证标准比例绿色方框（1.585:1），居中 */
.guide-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
}
.guide-frame {
    position: absolute;
    width: 80%;
    aspect-ratio: 1.585 / 1;
    left: 10%;
    top: 52%;
    transform: translateY(-50%) scale(0.8);
}
.corner {
    position: absolute;
    width: 24px; height: 24px;
    border-color: #4caf50;
    border-style: solid;
    border-width: 3px;
}
.corner-tl { top: 0; left: 0; border-right: none; border-bottom: none; }
.corner-tr { top: 0; right: 0; border-left: none; border-bottom: none; }
.corner-bl { bottom: 0; left: 0; border-right: none; border-top: none; }
.corner-br { bottom: 0; right: 0; border-left: none; border-top: none; }

/* 按钮 */
.btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
}
.btn-row .btn {
    flex: 1;
    min-width: 90px;
    padding: 10px 12px;
    border: 1px solid #ccc;
    background: #f8f9fa;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    text-align: center;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}
.btn-row .btn:hover { background: #e9ecef; border-color: #999; }
.btn-camera { border-color: #007bff; color: #007bff; }
.btn-camera:hover { background: #007bff; color: #fff; }
.btn-upload { border-color: #6c757d; color: #6c757d; }
.btn-upload:hover { background: #6c757d; color: #fff; }
.btn-row input[type="file"] { display: none; }

/* 操作栏 — 按钮在容器下方 */
.action-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
}
.action-bar .btn {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
}
.btn-capture { background: #28a745; color: #fff; }
.btn-capture:hover { background: #218838; }
.btn-retake { background: #dc3545; color: #fff; }
.btn-retake:hover { background: #c82333; }

/* 提交 */
.submit-wrap {
    text-align: center;
    margin-top: 24px;
}
.btn-submit {
    padding: 14px 48px;
    font-size: 18px;
    font-weight: 500;
    background: linear-gradient(135deg, #007bff, #0056b3);
    color: #fff;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.2s;
}
.btn-submit:hover { opacity: 0.9; }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

.badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    margin-left: 6px;
}
.badge-ok { background: #d4edda; color: #155724; }
.badge-no { background: #f8d7da; color: #721c24; }

/* 错误提示 */
.error-toast {
    display: none;
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 99999;
    background: #dc3545;
    color: #fff;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    text-align: center;
    max-width: 90vw;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.3s;
}
.error-toast.show { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>

<div class="idcard-upload-page d-flex flex-column" style="min-height:100vh">

    <h2 class="text-center mb-3">📇 身份证图片上传</h2>

    <!-- 上：人像面 -->
    <div class="flex-shrink-0">
        <div class="idcard-side" data-side="人像">
            <h3>人像面
                <span class="badge badge-no" id="badge-人像">未选择</span>
            </h3>
            <div class="media-container" id="container-人像">
                <div class="media-placeholder" id="placeholder-人像">👆 请拍照或选择图片</div>
                <video id="video-人像" autoplay playsinline muted hidden></video>
                <img id="img-人像" hidden>
                <div class="guide-overlay">
                    <div class="guide-frame">
                        <div class="corner corner-tl"></div>
                        <div class="corner corner-tr"></div>
                        <div class="corner corner-bl"></div>
                        <div class="corner corner-br"></div>
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button type="button" class="btn btn-camera" onclick="startCamera('人像')">📷 拍照</button>
                <label class="btn btn-upload">📤 上传
                    <input type="file" accept="image/*" onchange="handleImage('人像', this)">
                </label>
            </div>
            <div class="action-bar" id="actions-人像" hidden>
                <button type="button" class="btn btn-capture" onclick="capturePhoto('人像')">📸 拍摄</button>
                <button type="button" class="btn btn-retake" onclick="retake('人像')">🔄 重拍</button>
            </div>
        </div>
    </div>

    <hr class="my-2">

    <!-- 中：国徽面 -->
    <div class="flex-shrink-0">
        <div class="idcard-side" data-side="国徽">
            <h3>国徽面
                <span class="badge badge-no" id="badge-国徽">未选择</span>
            </h3>
            <div class="media-container" id="container-国徽">
                <div class="media-placeholder" id="placeholder-国徽">👆 请拍照或选择图片</div>
                <video id="video-国徽" autoplay playsinline muted hidden></video>
                <img id="img-国徽" hidden>
                <div class="guide-overlay">
                    <div class="guide-frame">
                        <div class="corner corner-tl"></div>
                        <div class="corner corner-tr"></div>
                        <div class="corner corner-bl"></div>
                        <div class="corner corner-br"></div>
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button type="button" class="btn btn-camera" onclick="startCamera('国徽')">📷 拍照</button>
                <label class="btn btn-upload">📤 上传
                    <input type="file" accept="image/*" onchange="handleImage('国徽', this)">
                </label>
            </div>
            <div class="action-bar" id="actions-国徽" hidden>
                <button type="button" class="btn btn-capture" onclick="capturePhoto('国徽')">📸 拍摄</button>
                <button type="button" class="btn btn-retake" onclick="retake('国徽')">🔄 重拍</button>
            </div>
        </div>
    </div>

    <!-- 下：提交按钮 -->
    <div class="mt-auto pt-3 pb-4 text-center">
        {% csrf_token %}
        <button type="button" class="btn-submit" id="btn-submit" onclick="submitPhoto()">提交</button>
    </div>
</div>

<!-- 错误提示弹窗 -->
<div class="error-toast" id="error-toast"></div>

<script>
// ============ 状态 ============
const state = {
    '人像': { compressedBlob: null, stream: null },
    '国徽': { compressedBlob: null, stream: null },
};
const MAX_W = 1280, MAX_H = 800;
const JPEG_QUALITY = 0.6;

function updateBadge(side) {
    const badge = document.getElementById('badge-' + side);
    const ok = !!state[side].compressedBlob;
    badge.textContent = ok ? '✅ 已选择' : '未选择';
    badge.className = 'badge ' + (ok ? 'badge-ok' : 'badge-no');
}

function stopCamera(side) {
    const s = state[side];
    if (s.stream) {
        s.stream.getTracks().forEach(function(t) { t.stop(); });
        s.stream = null;
    }
    document.getElementById('actions-' + side).hidden = true;
}

// ============ 拍照 ============
async function startCamera(side) {
    // 先关闭所有摄像头（iOS 一次只能有一个摄像头流）
    ['人像','国徽'].forEach(function(s) {
        if (state[s].stream) {
            state[s].stream.getTracks().forEach(function(t) { t.stop(); });
            state[s].stream = null;
        }
        document.getElementById('actions-' + s).hidden = true;
    });
    const s = state[side];
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        s.stream = stream;
        const video = document.getElementById('video-' + side);
        video.srcObject = stream;
        video.hidden = false;
        document.getElementById('img-' + side).hidden = true;
        document.getElementById('placeholder-' + side).hidden = true;
        document.getElementById('actions-' + side).hidden = false;
    } catch (e) {
        alert('无法开启摄像头: ' + e.message);
    }
}

function capturePhoto(side) {
    const video = document.getElementById('video-' + side);
    if (!video.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const img = document.getElementById('img-' + side);
    img.src = canvas.toDataURL('image/jpeg');
    img.hidden = false;
    video.hidden = true;
    document.getElementById('placeholder-' + side).hidden = true;
    stopCamera(side);
    compressAndUpdate(side, canvas);
}

function retake(side) {
    state[side].compressedBlob = null;
    document.getElementById('img-' + side).hidden = true;
    document.getElementById('placeholder-' + side).hidden = false;
    updateBadge(side);
    startCamera(side);
}

// ============ 相册 / 文件 ============
function handleImage(side, input) {
    const file = input.files[0];
    if (!file) return;
    stopCamera(side);
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const preview = document.getElementById('img-' + side);
            preview.src = e.target.result;
            preview.hidden = false;
            document.getElementById('video-' + side).hidden = true;
            document.getElementById('placeholder-' + side).hidden = true;
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > MAX_W) { h = h * MAX_W / w; w = MAX_W; }
            if (h > MAX_H) { w = w * MAX_H / h; h = MAX_H; }
            canvas.width = Math.round(w);
            canvas.height = Math.round(h);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            compressAndUpdate(side, canvas);
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    input.value = '';
}

// ============ 压缩 + 更新状态 ============
function compressAndUpdate(side, sourceCanvas) {
    let w = sourceCanvas.width, h = sourceCanvas.height;
    if (w > MAX_W) { h = h * MAX_W / w; w = MAX_W; }
    if (h > MAX_H) { w = w * MAX_H / h; h = MAX_H; }
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w);
    canvas.height = Math.round(h);
    canvas.getContext('2d').drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(function(blob) {
        state[side].compressedBlob = blob;
        updateBadge(side);
    }, 'image/jpeg', JPEG_QUALITY);
}

// ============ 显示错误 ============
function showError(msg) {
    const el = document.getElementById('error-toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 5000);
}

// ============ 提交 ============
async function submitPhoto() {
    const frontBlob = state['人像'].compressedBlob;
    const backBlob = state['国徽'].compressedBlob;
    if (!frontBlob || !backBlob) {
        showError('请同时选择人像面和国徽面的图片');
        return;
    }
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = '上传中...';
    const formData = new FormData();
    formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    formData.append('人像', frontBlob, 'front.jpg');
    formData.append('国徽', backBlob, 'back.jpg');
    try {
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, 60000);
        const resp = await fetch(window.location.href, { method: 'POST', body: formData, signal: controller.signal });
        clearTimeout(timer);

        if (resp.redirected) {
            window.location.href = resp.url;
        } else if (resp.ok) {
            window.location.reload();
        } else {
            let msg = '提交失败（' + resp.status + '）';
            try {
                const text = await resp.text();
                try { const j = JSON.parse(text); msg = j.error || msg; }
                catch(e) { msg = text.substring(0, 200) || msg; }
            } catch(e) {}
            showError(msg);
            btn.disabled = false;
            btn.textContent = '提交';
        }
    } catch (e) {
        showError('网络错误: ' + e.message);
        btn.disabled = false;
        btn.textContent = '提交';
    }
}
</script>
{% endblock %}
